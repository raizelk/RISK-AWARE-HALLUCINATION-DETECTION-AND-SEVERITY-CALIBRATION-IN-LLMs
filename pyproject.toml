[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucination-detector"
version = "0.1.0"
description = "Evidence-grounded hallucination detection and severity calibration for LLM responses"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
retrieval = ["sentence-transformers>=3.0"]
verification = [
	"sentence-transformers>=3.0",
	"transformers>=4.40",
	"torch>=2.0",
]
dashboard = [
	"streamlit>=1.40",
	"plotly>=5.24",
	"pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]